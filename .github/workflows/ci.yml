name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - evaluation-2026

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv run --locked ruff check evaluation tests macro-benchmark
      - run: uv run --locked ruff format --check evaluation tests macro-benchmark

  # The same Python versions as PyCG. The tests of the scorer and the
  # tracer need Python 3.14 and skip themselves below it. The tests of the
  # runner and of the compiler facts (tests/test_annotation_lambdas.py) run
  # on every version, and some of their cases run only on 3.12 and 3.13.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run --locked pytest
