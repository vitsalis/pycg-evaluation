# The evaluation with Docker only: one command per table.
#
#   docker compose -f evaluation/compose.yaml build inputs   # every pinned input
#   docker compose -f evaluation/compose.yaml run --rm rq1   # one table
#
# The one rule of the network: every download, and every git command on
# third-party content, runs in the build of the inputs image
# (container/Dockerfile.inputs); the other images take their inputs from it
# at their own build. No service has network, and nothing runs on the
# host. A table goes to evaluation/results/, the only host path that a
# question writes. See evaluation/README.md ("Docker Compose").
#
# A service runs as user 1000:1000. If that is not your user on Linux:
#   export EVAL_UID=$(id -u) EVAL_GID=$(id -g)
#
# rq1-trace, rq3, rq3-pilot, rq4, rq4-pilot and a prior tool's service take
# --jobs K
# (`run --rm rq3 --jobs 3`, `run --rm pyan rq3 --jobs 3`): K analyses at a
# time, each with its own limit of 16 GiB (every run: 30 minutes and 16 GiB;
# rq1, one at a time, has the same memory). Their memory is EVAL_MEMORY
# (default 18g, for K = 1) and their CPUs EVAL_CPUS (default 4): for K jobs
# give them K x 16 GiB + 2 GiB and K CPUs (K at least 4), for example
#   EVAL_MEMORY=50g EVAL_CPUS=4 docker compose -f evaluation/compose.yaml run --rm rq3 --jobs 3
#
# The file is plain YAML: mappings, lists of scalars, JSON lists, and the
# anchors below; tests/test_compose.py reads it without a YAML library.

name: pycg-evaluation

# The one pin of the Python image, by digest: the image of the traces of
# the macro-benchmark (its requirements/*.installed.txt name it).
x-python-image: &python-image python:3.14-slim@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
# The bases of the prior tools' images, each the Python that its pinned
# requirements were resolved for (tools/pins.json base_images; the test
# checks them against it).
x-python-pyan: &python-pyan python:3.15-slim@sha256:65a65fc7b30b06cb6df4930fd4650697cb23f4c2698ab81fc87e4b031bc36928
x-python-313: &python-313 python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
x-python-cpygraph: &python-cpygraph python:3.14@sha256:a7097ae62ea4cf4fec036282cbf97f0d0b7b4f9cb286277951115fb30442527d
x-python-headergen: &python-headergen python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b

# What every service of this file has: no network, a read-only root, no
# capability, a non-root user (the caller's, so that the files it writes
# are the caller's), tmpfs scratch, the repository read-only.
x-sealed: &sealed
  network_mode: none
  read_only: true
  user: "${EVAL_UID:-1000}:${EVAL_GID:-1000}"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 512
  cpus: 4

x-question: &question
  <<: *sealed
  image: pycg-evaluation-runner
  build:
    context: container
    dockerfile: Dockerfile.runner
    additional_contexts:
      inputs: service:inputs
    args:
      PYTHON_IMAGE: *python-image
  mem_limit: 6g
  memswap_limit: 6g
  tmpfs:
    - /tmp:size=2g
    - /pycg-evaluation:size=1m
  environment:
    HOME: /tmp
    PYTHONHASHSEED: "0"
    PYTHONDONTWRITEBYTECODE: "1"
    PYCG: /repo/${PYCG:-PyCG}
    ORIGINAL: ${ORIGINAL-046479ebcbc27a3ff7a7fa45cc08336726fb0bc9}
  volumes:
    - ..:/repo:ro
    - ./results:/results

# A prior tool: its image, built from tools/docker/ with the context
# evaluation/ (only tools/ goes in: .dockerignore) and the inputs image as
# the additional context `inputs` (the tool's trees, the inputs of the
# questions); the entry
# container/tool_job.py runs the jobs of one question one after another
# (`run --rm TOOL QUESTION`, QUESTION rq1, rq3, rq3-pilot, rq1-trace, rq4
# or rq4-pilot). rq1 and rq3 write results/tools/<row>/QUESTION.json, and
# rq1 the graph of each macro project to results/graphs/<row>/; the graphs
# of rq1-trace and rq4 go to the volume tool-graphs, which their questions
# read (they are large).
x-tool: &tool
  <<: *sealed
  mem_limit: ${EVAL_MEMORY:-18g}
  memswap_limit: ${EVAL_MEMORY:-18g}
  cpus: ${EVAL_CPUS:-4}
  tmpfs:
    - /tmp:size=4g
  environment:
    HOME: /tmp
    PYTHONHASHSEED: "0"
    PYTHONDONTWRITEBYTECODE: "1"
  volumes:
    - ..:/repo:ro
    - ./results:/results
    - tool-graphs:/tool-graphs

volumes:
  tool-graphs: {}

services:
  # Every pinned input (container/Dockerfile.inputs): the projects of the
  # macro-benchmark, the prior tools' sources, the corpus of RQ3,
  # DyPyBench's traces and the export of RQ4's dataset, fetched when the
  # image is built. The images below take theirs from it. A run of it
  # serves the commands of evaluation/README.md that read the inputs (a
  # copy of the sources for reading, pin.py trees).
  inputs:
    <<: *sealed
    image: pycg-evaluation-inputs
    build:
      context: ..
      dockerfile: evaluation/container/Dockerfile.inputs
      args:
        PYTHON_IMAGE: *python-image
    mem_limit: 2g
    memswap_limit: 2g
    tmpfs:
      - /tmp:size=256m
    environment:
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
    working_dir: /repo
    volumes:
      - ..:/repo:ro

  # The questions: the PyCG rows and the tables
  # (container/question_entry.py), and the re-trace of one macro project
  # (container/trace_entry.py).
  rq1:
    <<: *question
    mem_limit: ${EVAL_MEMORY:-18g}
    memswap_limit: ${EVAL_MEMORY:-18g}
    cpus: ${EVAL_CPUS:-4}
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/question_entry.py", "rq1"]
  rq1-trace:
    <<: *question
    mem_limit: ${EVAL_MEMORY:-18g}
    memswap_limit: ${EVAL_MEMORY:-18g}
    cpus: ${EVAL_CPUS:-4}
    volumes:
      - ..:/repo:ro
      - ./results:/results
      - tool-graphs:/tool-graphs:ro
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/question_entry.py", "rq1-trace"]
  rq2:
    <<: *question
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/question_entry.py", "rq2"]
  rq3:
    <<: *question
    mem_limit: ${EVAL_MEMORY:-18g}
    memswap_limit: ${EVAL_MEMORY:-18g}
    cpus: ${EVAL_CPUS:-4}
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/question_entry.py", "rq3"]
  rq3-pilot:
    <<: *question
    mem_limit: ${EVAL_MEMORY:-18g}
    memswap_limit: ${EVAL_MEMORY:-18g}
    cpus: ${EVAL_CPUS:-4}
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/question_entry.py", "rq3-pilot"]
  rq4-pilot:
    <<: *question
    mem_limit: ${EVAL_MEMORY:-18g}
    memswap_limit: ${EVAL_MEMORY:-18g}
    cpus: ${EVAL_CPUS:-4}
    volumes:
      - ..:/repo:ro
      - ./results:/results
      - tool-graphs:/tool-graphs:ro
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/question_entry.py", "rq4-pilot"]
  rq4:
    <<: *question
    mem_limit: ${EVAL_MEMORY:-18g}
    memswap_limit: ${EVAL_MEMORY:-18g}
    cpus: ${EVAL_CPUS:-4}
    volumes:
      - ..:/repo:ro
      - ./results:/results
      - tool-graphs:/tool-graphs:ro
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/question_entry.py", "rq4"]
  trace:
    <<: *sealed
    image: pycg-trace-${NAME:-unset}
    build:
      context: ../macro-benchmark/requirements
      dockerfile: ../../evaluation/container/Dockerfile.trace
      additional_contexts:
        inputs: service:inputs
      args:
        PYTHON_IMAGE: *python-image
        NAME: ${NAME:-unset}
        REQUIREMENTS: ${NAME:-unset}.txt
    mem_limit: 6g
    memswap_limit: 6g
    tmpfs:
      - /tmp:size=1g
      - /home/runner:size=256m
    environment:
      HOME: /home/runner
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHON_IMAGE: *python-image
    volumes:
      - ..:/repo:ro
      # only its own directory: a test suite must not reach the tables
      - ./results/trace:/results/trace
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/trace_entry.py", "${NAME:-unset}"]

  # The prior tools (x-tool above). JARVIS has three rows and PyAnalyzer
  # two: a run of rq1 or rq1-trace writes all, `--variant N` one; rq3 and
  # rq4 run the headline row only.
  pyan:
    <<: *tool
    image: pycg-tool-pyan
    build:
      context: .
      dockerfile: tools/docker/pyan.Dockerfile
      additional_contexts:
        inputs: service:inputs
      args:
        PYTHON_IMAGE: *python-pyan
        TOOL_PIN: "pyan3 v2.9.0 8e8bd90646de039696b91fdf2d970e02fe8d1f62"
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/tool_job.py", "pyan"]
  jarvis:
    <<: *tool
    image: pycg-tool-jarvis
    build:
      context: .
      dockerfile: tools/docker/jarvis.Dockerfile
      additional_contexts:
        inputs: service:inputs
      args:
        PYTHON_IMAGE: *python-313
        TOOL_PIN: "JARVIS 8871b86 8871b86494a1aec0095686ffa543994a7361af88"
        TREES: "source=048b257ebd118afc6e2a1178a7e755a7a681336d1aa0d3bc7624a73aac27909d"
        TREE_SOURCE: "048b257ebd118afc6e2a1178a7e755a7a681336d1aa0d3bc7624a73aac27909d"
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/tool_job.py", "jarvis"]
  cpygraph:
    <<: *tool
    image: pycg-tool-cpygraph
    build:
      context: .
      dockerfile: tools/docker/cpygraph.Dockerfile
      additional_contexts:
        inputs: service:inputs
      args:
        PYTHON_IMAGE: *python-cpygraph
        TOOL_PIN: "CPyGraph v0.1.0 984d34ed2f6b81eecb60b975723ad20394ec4a69"
        TREES: "source=a7f47f7fa7cb1d953ff8bb78d284097c686fd2e76da259c52e8053f4af563c10"
        TREE_SOURCE: "a7f47f7fa7cb1d953ff8bb78d284097c686fd2e76da259c52e8053f4af563c10"
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/tool_job.py", "cpygraph"]
  pyanalyzer:
    <<: *tool
    image: pycg-tool-pyanalyzer
    build:
      context: .
      dockerfile: tools/docker/pyanalyzer.Dockerfile
      additional_contexts:
        inputs: service:inputs
      args:
        PYTHON_IMAGE: *python-313
        TOOL_PIN: "PyAnalyzer ea143ef ea143ef8bdec2b5f8841bb600b348f0975b90349"
        TREES: "source=e3fb6647bad8fed05fa883a517e7323152cf4e5643dde4e10364f15355239cab"
        TREE_SOURCE: "e3fb6647bad8fed05fa883a517e7323152cf4e5643dde4e10364f15355239cab"
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/tool_job.py", "pyanalyzer"]
  # HeaderGen imports the analysed code: rq1 only. A macro project with
  # runtime dependencies runs in headergen-deps, one image per project, as
  # `trace` (NAME; its default `unset` is refused by the entry):
  #   NAME=X docker compose -f evaluation/compose.yaml build headergen-deps
  #   NAME=X docker compose -f evaluation/compose.yaml run --rm headergen-deps rq1
  headergen:
    <<: *tool
    image: pycg-tool-headergen
    build:
      context: .
      dockerfile: tools/docker/headergen.Dockerfile
      additional_contexts:
        inputs: service:inputs
      args:
        PYTHON_IMAGE: *python-headergen
        TOOL_PIN: "HeaderGen 1ea5226 1ea52265ca4e76bb202a2deb26f3b9394d3caa95"
        TREES: "headergen=883efd3447d0949a75832eedc7809b5b0f63943b35d4b0b0480fd7255d257148;typeshed=2358c44a3e580d34011e74338586d6be2784eee88492cd18e4d758b8b2187270"
        TREE_HEADERGEN: "883efd3447d0949a75832eedc7809b5b0f63943b35d4b0b0480fd7255d257148"
        TREE_TYPESHED: "2358c44a3e580d34011e74338586d6be2784eee88492cd18e4d758b8b2187270"
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/tool_job.py", "headergen"]
  headergen-deps:
    <<: *tool
    image: pycg-tool-headergen-deps-${NAME:-unset}
    build:
      context: tools/headergen-deps
      dockerfile: ../docker/headergen-deps.Dockerfile
      args:
        PYTHON_IMAGE: *python-headergen
        TOOL_IMAGE: pycg-tool-headergen
        REQUIREMENTS: ${NAME:-unset}.txt
    entrypoint: ["python3", "-I", "-B", "/repo/evaluation/container/tool_job.py", "headergen", "--project", "${NAME:-unset}"]
